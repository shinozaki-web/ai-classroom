<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>この端末の進捗確認 | 門司港AI教室</title>
<link rel="stylesheet" href="shared.css">
<style>
  body{background:#f5f7fb;color:#24324a}
  .page{max-width:760px;margin:0 auto;padding:28px 16px 64px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  h1{font-family:'M PLUS Rounded 1c',sans-serif;font-size:24px;margin:0}
  .back{color:#2563a8;text-decoration:none;font-weight:700}
  .notice,.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(30,50,90,.08);margin-bottom:16px}
  .notice{border-left:5px solid #f5a623;line-height:1.8;font-size:14px}
  .profile{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .metric{background:#f4f7fc;border-radius:12px;padding:14px;text-align:center}
  .metric strong{display:block;font-size:22px;color:#2563a8;margin-bottom:4px}
  .metric span{font-size:12px;color:#667085}
  .student-name{font-size:21px;font-weight:800;margin-bottom:5px}
  .student-meta{font-size:13px;color:#667085;margin-bottom:18px}
  .bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:8px 0 20px}
  .bar-fill{height:100%;background:linear-gradient(90deg,#4a90e2,#34c88a);border-radius:99px}
  .lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .lesson{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border-radius:10px;padding:11px 13px;font-size:13px;gap:10px}
  .done{color:#17844f;font-weight:700}.pending{color:#8a94a6}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  button{border:0;border-radius:10px;padding:11px 16px;background:#2563a8;color:#fff;font-weight:700;cursor:pointer}
  button.secondary{background:#eef3fa;color:#2563a8}
  .empty{text-align:center;padding:28px 10px;color:#667085;line-height:1.8}
  @media(max-width:560px){.profile{grid-template-columns:1fr}.lessons{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <h1>📊 この端末の進捗確認</h1>
    <a class="back" href="index.html">← カリキュラムへ戻る</a>
  </div>

  <div class="notice">
    この画面には、現在開いているChromeに保存された生徒1人分の進捗だけが表示されます。<br>
    クラウドへの送信や、ほかのパソコンの進捗収集は行いません。
  </div>

  <section class="panel" id="progress-panel"></section>
</main>

<script>
const LESSON_TITLES = [
  'AIってなんだろう？','聞き方を変えると変わる','役割を与えてみよう','AIに教えてあげよう',
  '詩・物語を作る','クイズ・なぞなぞを作る','北九州を調べよう','発表資料を作る',
  '自由制作①','自由制作②・発表','AIのウソを見破れ！','AIの使い方のルール',
  '北九州の課題を解決しよう','卒業チャレンジ'
];

function readState() {
  try { return JSON.parse(localStorage.getItem('ai-classroom-state') || 'null'); }
  catch { return null; }
}

function create(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function downloadBackup() {
  const data = { exportedAt: new Date().toISOString(), state: readState(), lessons: {} };
  for (let i = 1; i <= 14; i++) {
    try {
      const value = localStorage.getItem(`lesson${i}-state`);
      if (value) data.lessons[i] = JSON.parse(value);
    } catch {}
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `ai-classroom-${new Date().toISOString().slice(0,10)}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
}

function render() {
  const panel = document.getElementById('progress-panel');
  const state = readState();
  if (!state?.name) {
    const empty = create('div', 'empty');
    empty.append(create('strong', '', 'このChromeには、まだ生徒データがありません。'), document.createElement('br'), document.createTextNode('先にカリキュラムトップで名前を登録してください。'));
    panel.append(empty);
    return;
  }

  const completed = state.lessonCompleted || {};
  const doneCount = LESSON_TITLES.filter((_, index) => Boolean(completed[index + 1] || completed[String(index + 1)])).length;
  panel.append(create('div', 'student-name', `${state.name}さん`));
  panel.append(create('div', 'student-meta', [state.grade, state.ward, state.classCode && state.classCode !== 'クラスなし' ? `クラス：${state.classCode}` : ''].filter(Boolean).join('　')));

  const metrics = create('div', 'profile');
  const progressMetric = create('div', 'metric');
  progressMetric.append(create('strong', '', `${doneCount} / 14`), create('span', '', '完了した授業'));
  const badgeMetric = create('div', 'metric');
  badgeMetric.append(create('strong', '', String((state.seenBadges || []).length)), create('span', '', '確認済みバッジ'));
  const storageMetric = create('div', 'metric');
  storageMetric.append(create('strong', '', 'Chrome'), create('span', '', '保存場所'));
  metrics.append(progressMetric, badgeMetric, storageMetric);
  panel.append(metrics);

  const bar = create('div', 'bar');
  const fill = create('div', 'bar-fill');
  fill.style.width = `${Math.round(doneCount / 14 * 100)}%`;
  bar.append(fill);
  panel.append(bar);

  const lessons = create('div', 'lessons');
  LESSON_TITLES.forEach((title, index) => {
    const done = Boolean(completed[index + 1] || completed[String(index + 1)]);
    const row = create('div', 'lesson');
    row.append(create('span', '', `第${index + 1}回　${title}`), create('span', done ? 'done' : 'pending', done ? '完了' : '未完了'));
    lessons.append(row);
  });
  panel.append(lessons);

  const actions = create('div', 'actions');
  const backup = create('button', '', '💾 この端末のデータを保存');
  backup.type = 'button';
  backup.addEventListener('click', downloadBackup);
  const reload = create('button', 'secondary', '🔄 再読み込み');
  reload.type = 'button';
  reload.addEventListener('click', () => location.reload());
  actions.append(backup, reload);
  panel.append(actions);
}

render();
</script>
</body>
</html>
